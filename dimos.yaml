# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: Office
spec-version: v1.2
uses:
    "@dimos-gateway":
        # the running blueprint, whose robot joins the office as LIVE
        - GET /runs
        - GET /msgs.js
    "@zenoh-gateway": ">=0.5 <0.6"
# what the page does on zenoh: the live robot's odom and camera in; its nav goals and key driving out
zenoh:
    default_permission: deny
    read:
        - id: odom-and-camera
          messages: [declare_subscriber, put]
          key_exprs: ["dimos/odom/geometry_msgs.PoseStamped", "dimos/color_image/sensor_msgs.Image"]
          permission: allow
    write:
        - id: goals-and-drive
          messages: [put]
          key_exprs: ["dimos/goal_pose/geometry_msgs.PoseStamped", "dimos/cmd_vel/geometry_msgs.Twist"]
          permission: allow
