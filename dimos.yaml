# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: Office
version: "0.2.1"
spec-version: v1.4
uses:
    "@dimos-gateway":
        # the running blueprint, whose robot joins the office as LIVE
        - GET /active
        # its streams: which topics are its odom, goal input, cmd_vel and camera
        - GET /catalog/blueprints/{name}
        - GET /msgs.js
    "@desktop-gateway":
        # dim-app's zenoh client: where the zenoh-gateway and this app's namespace are
        - GET /management/gateways/zenoh
    "@zenoh-gateway": ">=0.5 <0.6"
# what the page does on zenoh (topic names come from the blueprint): the live robot's odom and camera in; its nav goals and key driving out
zenoh:
    default_permission: deny
    read:
        - id: odom-and-camera
          messages: [declare_subscriber, put]
          key_exprs: ["dimos/**/geometry_msgs.PoseStamped", "dimos/**/sensor_msgs.Image"]
          permission: allow
    write:
        - id: goals-and-drive
          messages: [put]
          key_exprs: ["dimos/**/geometry_msgs.PoseStamped", "dimos/**/geometry_msgs.Twist"]
          permission: allow
